# Copy into a private internal aggregation repository with this component at qualification-lab/.
# Supply approved source bundles under incoming/*.bundle.json.
# Use your site's approved Python runner/image and configure appropriate artifact access/retention.
stages: [qualify]
aggregate-qualification:
  stage: qualify
  script:
    - python3 -m unittest discover -s qualification-lab/tests -t qualification-lab -v
    - mkdir -p output/qualification-lab
    - cp -R qualification-lab/web output/qualification-lab/web
    - cp qualification-lab/lab.py qualification-lab/seed.json qualification-lab/README.md output/qualification-lab/
    - python3 qualification-lab/lab.py --system-id master --data output/master.sqlite ingest incoming/*.bundle.json
    - tar -czf qualification-master.tar.gz -C output qualification-lab master.sqlite
  artifacts:
    paths: [qualification-master.tar.gz]
    expire_in: 30 days
