set -g mouse on
set -g history-limit 20000
set -g status-interval 15
set -g status-style 'bg=default,fg=cyan'
set -g status-left-length 32
set -g status-left '#[bold] ws:#{WS_SITE} #[default] '
set -g status-right-length 48
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bold,reverse] #I:#W #[default]'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=cyan'
set -g message-style 'bg=default,fg=cyan'
# Advertise only an entry available on the host; the image supplies all three.
run-shell 'if infocmp tmux-256color >/dev/null 2>&1; then tmux set -g default-terminal tmux-256color; elif infocmp screen-256color >/dev/null 2>&1; then tmux set -g default-terminal screen-256color; else tmux set -g default-terminal screen; fi'
if-shell '[ "$WS_COLOR" = truecolor ] || { [ "${WS_COLOR:-auto}" = auto ] && { [ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]; }; }' 'set -as terminal-overrides ",*:Tc"'
if-shell '[ "$WS_COLOR" = never ] || [ "${NO_COLOR+x}" = x ]' 'set -g status-style default; set -g pane-border-style default; set -g pane-active-border-style default; set -g message-style default'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Return to the remaining pane or parent shell when a pane's command exits.
set -g remain-on-exit off
set -g escape-time 20
setw -g mode-keys vi
# Ordinary keys work with PuTTY and VS Code; leave shell Ctrl-H/J/K/L alone.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell '[ "$WS_LAYOUT" = thin-v1 ]' 'set -g default-shell /workspace-tools/bin/bash; set -g default-command /workspace-tools/thin-shell'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
run-shell 'tmux set-option -g @resurrect-dir "$WS_SESSION_STATE"'
run-shell '"$WS_ROOT/share/tmux-resurrect/resurrect.tmux"'
# Each workspace has a separate snapshot directory. Call continuum's saver
# directly so its single-server preference does not disable other workspaces.
set -g status-right '#("$WS_ROOT/share/tmux-continuum/scripts/continuum_save.sh")#{WS_CONTEXT}@#H | %H:%M'
set-hook -g client-detached 'run-shell -b "\"$WS_ROOT/share/tmux-resurrect/scripts/save.sh\" quiet"'
# Applies to the dedicated workspace server; normal host tmux is untouched.
source-file -q "$HOME/.config/hpc-workspace/tmux.conf"
